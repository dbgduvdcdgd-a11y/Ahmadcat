    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      @keyframes highlight-animation {
        from { background-color: rgba(71, 85, 105, 0.8); } /* Equivalent to Tailwind's slate-700 with opacity */
        to { background-color: transparent; }
      }
      .highlight-message {
        animation: highlight-animation 1.5s ease-out;
      }
      @keyframes slide-up-animation {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up-animation 0.3s ease-out;
      }
    </style>
